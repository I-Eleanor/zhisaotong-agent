# 智扫通 - 一键启动 API(FastAPI) + 前端(React/Vite，由 nginx 提供)
# 用法：
#   docker compose up -d --build
#   前端: http://localhost:8511    API 文档: http://localhost:8000/docs
services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env.docker
    volumes:
      - chroma_data:/app/chroma_db
      - app_logs:/app/logs
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8511:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  chroma_data:
  app_logs:
