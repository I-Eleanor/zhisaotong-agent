# 智扫通 - 一键启动 API(FastAPI) + 前端(React/Vite，由 nginx 提供)
# 用法：
#   docker compose up -d --build
#   前端: http://localhost:8511    API 文档: http://localhost:8000/docs
services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    # nginx 在容器内监听 80，映射到宿主 8511
    ports:
      - "8511:80"
    # 前端静态资源由 nginx 提供；/api 由 nginx 反代到 api 服务（见 frontend/nginx.conf）
    depends_on:
      - api
    restart: unless-stopped
