[project]
name = "agent-project"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["agent", "api", "rag", "utils", "model", "mcp_server", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "rag", "utils", "model", "mcp_server"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.coverage.run]
parallel = false
source = ["agent", "rag", "api", "utils", "model"]
omit = ["tests/*", "scripts/*", "agent/services/http_services.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.coverage.coverage_core_modules]
fail_under = 75
sources = [
    "agent/orchestrator.py",
    "agent/diagnostic_agent.py",
    "agent/conversation_agent.py",
    "rag/rag_service.py",
    "rag/vector_store.py",
    "api/streaming.py",
]
